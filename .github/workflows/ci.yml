name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.13
        run: uv venv --python 3.13

      - name: Install dependencies
        # 装 dev + 可靠 ML 轮子（scikit-learn/statsmodels），跳过 prophet 以规避 cmdstanpy 编译
        run: |
          uv pip install -e '.[dev]'
          uv pip install scikit-learn statsmodels

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests (pytest, coverage gate ≥70% on services via addopts)
        run: uv run pytest --cov-report=term-missing
