[project]
name = "smart-farm"
version = "0.1.0"
description = "智慧大棚数据管理平台（从 0 重写）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "pyarrow>=15.0",
    "altair>=5.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "psutil>=6.0",
]

[project.optional-dependencies]
doc = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_farm"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=smart_farm.services --cov-fail-under=70"

[tool.coverage.run]
source = ["smart_farm.services"]
omit = ["*/__pycache__/*", "*/tests/*"]
